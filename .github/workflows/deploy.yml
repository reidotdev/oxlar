name: Deploy

# Rebuilds and deploys the static site to Cloudflare Workers.
#   - push to main
#   - repository_dispatch "sanity-publish" (fired by the Sanity webhook, see docs/publishing.md)
#   - manual run
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

# One deploy at a time; a newer publish supersedes a queued one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped (not failed) until the repository has PUBLIC_SITE_URL set, so the
    # template repo itself and fresh clones show no red Deploy run. Job-level `if`
    # cannot see environment-scoped variables, hence repository-level variables below.
    if: ${{ vars.PUBLIC_SITE_URL != '' }}
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ vars.SANITY_DATASET }}
      SANITY_API_VERSION: ${{ vars.SANITY_API_VERSION }}
      PUBLIC_STYLEGUIDE: ${{ vars.PUBLIC_STYLEGUIDE }}
      SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm perf:size
      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
